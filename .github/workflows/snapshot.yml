# Publish the site's own answers as static files.
#
# Every page here renders in the browser, so an agent that fetches one gets an
# empty shell: `?agent=1` is mounted by javascript and the numbers arrive from a
# fetch that only happens once a browser runs the script. The agent card says
# "you are welcome here" and then hands a curl an html skeleton.
#
# So run the same lib/ code in node on a schedule and push the output to the
# orphan `data` branch, force-pushed as a single commit each time. Nothing lands
# on main: this repo's history is written by hand, and 48 robot commits a day
# would bury it.
#
# The tool refuses to publish anything synthetic — no demo reef, no fixture
# replay — and exits non-zero instead. A failed run leaves the previous snapshot
# in place, which is the right outcome: stale and true beats fresh and invented.

name: snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# only ever one publisher; a slow run must not race the next one
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write            # to say so, before the schedule is switched off

jobs:
  publish:
    name: fetch live, publish to the data branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # no `npm ci`: lib/ has no runtime dependencies, which is the whole
      # reason this can run anywhere. three.js is the page's, not the data's.
      - name: build the snapshot
        run: node tools/snapshot.mjs --out=data --every="30 minutes"

      # a fresh orphan commit each run: the branch is a current-state feed,
      # not a history, and keeping every revision would grow forever for
      # nobody's benefit.
      - name: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q
          git checkout -qb data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "published $(ls | tr '\n' ' ')to the data branch"

      # GitHub switches off scheduled workflows in a public repo after 60 days
      # with no repository activity, and this job's own pushes go to `data` with
      # GITHUB_TOKEN — which may well not count. Nothing automated commits to
      # main, so the tip of main is the last time a person touched this repo.
      #
      # There is no way for a disabled workflow to wake itself up, so the only
      # honest move is to say something while it can still run.
      - name: will this still be running next month
        id: clock
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date -u +%s) - last ) / 86400 ))
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "::notice::$days days since the last push to main — the schedule is switched off at 60"

      - name: warn before the feed goes quiet
        if: fromJSON(steps.clock.outputs.days) >= 45
        uses: actions/github-script@v7
        with:
          script: |
            const days = ${{ steps.clock.outputs.days }};
            const left = 60 - days;
            const title = `the snapshot feed stops in ~${left} days unless someone pushes`;
            const body = [
              `It has been **${days} days** since the last commit on \`main\`. GitHub disables`,
              'scheduled workflows in a public repository after 60 days of inactivity, so the',
              `snapshot job has about **${left} days** left before it stops on its own.`,
              '',
              'Any push to `main` resets the clock. If it has already been disabled:',
              '',
              '```sh',
              'gh workflow enable snapshot.yml',
              '```',
              '',
              'Nothing is broken — the last published snapshot stays where it is, and it keeps',
              'carrying its own `data.asOf`, so anything reading it can see for itself how old',
              'it has become. But the corpus the next stage depends on stops growing here.',
              '',
              `[the run that noticed](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'keepalive',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['keepalive'],
              });
            }
